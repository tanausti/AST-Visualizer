<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Abstract Syntax Tree Visualizer</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script th:src="@{/js/ASTVisualizer.js}" defer></script>
    <script th:src="@{/js/VisualizeTree.js}" defer></script>

    <link rel="stylesheet" th:href="@{/css/ASTVisualizer.css}">
</head>

<body>

    <div class="center">
        <h1 class="header-title">C Abstract Syntax Tree Visualizer</h1>
        <h2 class="header-title">An educational tool for building compilers</h2>
    </div>

    <div class="flex-container center-horizontal">
        <button
            onclick="setModeClang(); setButtonPressedColors('clang-button'); setButtonUnpressedColors('kiln-button');"
            id="clang-button"
            class="compiler-button left-compiler-button">
            Clang
        </button>
        <button
            onclick="setModeKiln(); setButtonPressedColors('kiln-button'); setButtonUnpressedColors('clang-button');"
            id="kiln-button"
            class="compiler-button right-compiler-button">
            Custom Compiler (Kiln)
        </button>
    </div>
    <div class="content">

        <div class="left center">
            <textarea id="code"></textarea>
            <button id="submit-button" onclick="getCode()">Submit</button>
        </div>

        <div class="right">

            <div class="viewer">

                <div id="tree-container" class="center">
                    <svg id="tree-svg"></svg>
                </div>

                <textarea readonly id="json"></textarea>
			
				<p id="errorText"></p>

            </div>
			

            <div class="button-row">
				<button
				    id="graphic-ast-button"
				    onclick="setButtonPressedColors(id); setButtonUnpressedColors('json-tree-button'); show('tree-container'); show('tree-svg'); hide('json');">
				    Visual AST
				</button>

				<button
				    id="json-tree-button"
				    onclick="setButtonPressedColors(id); setButtonUnpressedColors('graphic-ast-button'); show('json'); hide('tree-container'); hide('tree-svg');">
				    JSON
				</button>
            </div>

        </div>

    </div>

</body>

</html>
