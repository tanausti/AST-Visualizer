<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>AST Visualizer</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script th:src="@{/js/ASTVisualizer.js}" defer></script>
    <script th:src="@{/js/VisualizeTree.js}" defer></script>

    <link rel="stylesheet" th:href="@{/css/ASTVisualizer.css}">
</head>

<body>

    <div class="center">
        <h1 class="header-title">AST Visualizer</h1>
    </div>


    <div class="flex-container center-horizontal">
        <button class="compiler-button left-compiler-button">
            Clang
        </button>

        <button class="compiler-button right-compiler-button">
            Custom Compiler (Kiln)
        </button>
    </div>


    <div class="content">

        <div class="left center">
            <textarea id="code"></textarea>
            <button onclick="getCode()">Submit</button>
        </div>


        <div class="right center">

            <div id="tree-container">
                <svg id="tree-svg"></svg>
            </div>

        </div>

    </div>

</body>

</html>
